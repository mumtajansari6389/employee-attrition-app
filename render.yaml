services:
  # Backend API Service
  - type: web
    name: employee-attrition-backend
    env: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.4"
      - key: DATABASE_URL
        fromDatabase:
          name: db
          property: connectionString
      - key: PYTHON_ENV
        value: "production"
      - key: CORS_ORIGINS
        value: '["https://employee-attrition-frontend.onrender.com"]'
    region: oregon

  # Frontend Static Site
  - type: web
    env: static
    name: employee-attrition-frontend
    buildCommand: "cd frontend && npm ci && npm run build"
    staticPublishPath: "frontend/dist"
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: employee-attrition-backend
          property: url
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"

databases:
  - name: db
    databaseName: attrition_production
    user: attrition_user
    plan: free
    region: oregon
